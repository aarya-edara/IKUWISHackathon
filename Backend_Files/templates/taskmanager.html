<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='calendarstyle.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Handjet:wght,ELSH@100..900,2&family=Pixelify+Sans:wght@400..700&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <title>Task Manager</title>



</head>

<body>

<img src="https://i.gifer.com/Mc28.gif" alt="Saturn" class="side-gif side-gif-left">
<img src="https://i.gifer.com/Mc28.gif" alt="Saturn" class="side-gif side-gif-right">

<img src="{{ url_for('static', filename='star.gif') }}" alt="" class="star star-5">
<img src="{{ url_for('static', filename='star.gif') }}" alt="" class="star star-6">
<img src="{{ url_for('static', filename='star.gif') }}" alt="" class="star star-7">
<img src="{{ url_for('static', filename='star.gif') }}" alt="" class="star star-8">

<nav>
    <a href="{{ url_for('dashboard') }}">Calendar</a>
</nav>


        <h1>Task Manager</h1>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p class="site-name">{{ message }}</p>
            {% endfor %}
        {% endwith %}



    <form method="POST">

        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <input name="task" placeholder="Task/assignment title" required>
        <fieldset class="duration-picker">
          <legend>Time Required</legend>

          <div class="input-group">
            <input type="number" name="hours" id="hours" min="0" placeholder="0" required>
            <label for="hours">hours</label>
          </div>

         <div class="input-group">
            <input type="number" name="minutes" id="minutes" min="0" max="59" placeholder="00" required>
            <label for="minutes">mins</label>
          </div>

        </fieldset>

        <fieldset class="duration-picker">
          <legend>Timeframe</legend>

          <div class="input-group">
            <input type="date" name="start_date" id="start_date" required>
            <label for="start_date">from</label>
          </div>

          <div class="input-group">
            <input type="date" name="end_date" id="end_date" required>
            <label for="end_date">to</label>
          </div>
        </fieldset>

        <div class="input-group">
            <input type="checkbox" name="skip_weekends" id="skip_weekends" style="width: auto;">
            <label for="skip_weekends">skip weekends</label>
        </div>

        <select name="priority">
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
        </select>
        <button type="submit">Add task</button>

    </form>

    {% if table_has_tasks %}
        <a href="{{ url_for('taskmanager.make_schedule') }}" class="done-btn">Done</a>
    {% else %}
        <span class="done-btn disabled">Done</span>
    {% endif %}

    {{ table|safe }}

    {% if table_has_tasks %}
    <form method="POST" action="{{ url_for('taskmanager.clear_tasks') }}" class="clear-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit">Clear all tasks</button>
    </form>
    {% endif %}


</body>
</html>
